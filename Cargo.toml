[package]
name = "dpu-node"
version = "0.2.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/dpu-core",
    "crates/dpu-network",
    "crates/dpu-inference",
    "crates/dpu-harness",
    "crates/dpu-ledger"
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ed25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
futures = "0.3"
bytes = "1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }

[dependencies]
dpu-core = { path = "crates/dpu-core" }
dpu-inference = { path = "crates/dpu-inference" }
dpu-harness = { path = "crates/dpu-harness" }
dpu-ledger = { path = "crates/dpu-ledger" }
dpu-network = { path = "crates/dpu-network" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v4"] }
futures = { workspace = true }
clap = { workspace = true }
ctrlc = { version = "3", features = ["termination"] }
