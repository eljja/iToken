[package]
name = "itoken-node"
version = "0.2.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/itoken-core",
    "crates/itoken-network",
    "crates/itoken-inference",
    "crates/itoken-harness",
    "crates/itoken-ledger"
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ed25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
futures = "0.3"
bytes = "1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"

[dependencies]
itoken-core = { path = "crates/itoken-core" }
itoken-inference = { path = "crates/itoken-inference" }
itoken-harness = { path = "crates/itoken-harness" }
itoken-ledger = { path = "crates/itoken-ledger" }
itoken-network = { path = "crates/itoken-network" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v4"] }
futures = { workspace = true }
clap = { workspace = true }
ctrlc = { version = "3", features = ["termination"] }
axum = { workspace = true }
tower-http = { workspace = true }
ed25519-dalek = { workspace = true }
async-stream = { workspace = true }
